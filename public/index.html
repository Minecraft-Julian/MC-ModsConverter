<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Mods Converter — AI-Powered Java → Bedrock</title>
    <meta name="description" content="Convert Minecraft Java mods to Bedrock addons using AI. Upload a .jar file and get a working .mcaddon instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-grid" id="bgGrid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Particle Canvas for conversion animation -->
    <canvas id="particleCanvas"></canvas>

    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header>
            <div class="header-row">
                <div class="logo-badge">
                    <div class="logo-cube" id="logoCube">
                        <div class="cube-face cube-front"></div>
                        <div class="cube-face cube-back"></div>
                        <div class="cube-face cube-right"></div>
                        <div class="cube-face cube-left"></div>
                        <div class="cube-face cube-top"></div>
                        <div class="cube-face cube-bottom"></div>
                    </div>
                </div>
                <div class="header-text">
                    <h1>MC Mods Converter</h1>
                    <p class="subtitle">AI-Powered Java → Bedrock Conversion</p>
                </div>
                <div class="header-actions">
                    <div class="ai-status" id="aiStatus" title="AI Status">
                        <span class="status-dot offline" id="statusDot"></span>
                        <span class="status-label" id="statusLabel">Checking AI...</span>
                    </div>
                    <select id="langSelect" class="lang-select">
                        <option value="en">EN</option>
                        <option value="de">DE</option>
                        <option value="fr">FR</option>
                        <option value="es">ES</option>
                        <option value="ja">JA</option>
                        <option value="zh">ZH</option>
                        <option value="ko">KO</option>
                        <option value="ru">RU</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Upload Section -->
        <section id="uploadSection">
            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a Java mod file">
                <input type="file" id="fileInput" class="file-input" accept=".jar,.zip">
                <div class="dropzone-content">
                    <div class="upload-icon-wrap">
                        <svg class="upload-icon" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <h3 id="dropzoneTitle">Drop your .jar file here</h3>
                    <p id="dropzoneSubtitle">or click to browse</p>
                    <div class="upload-chips">
                        <span class="chip">.jar</span>
                        <span class="chip">.zip</span>
                        <span class="chip-arrow">→</span>
                        <span class="chip chip-result">.mcaddon</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Conversion Section (hidden until upload) -->
        <section id="conversionSection" class="hidden">
            <!-- Minecraft Block Animation -->
            <div class="conversion-animation" id="conversionAnimation">
                <div class="morph-scene">
                    <div class="block-container" id="javaBlock">
                        <div class="mc-block java-block">
                            <div class="block-face block-front"><span>J</span></div>
                            <div class="block-face block-back"></div>
                            <div class="block-face block-right"></div>
                            <div class="block-face block-left"></div>
                            <div class="block-face block-top"></div>
                            <div class="block-face block-bottom"></div>
                        </div>
                        <span class="block-label">Java</span>
                    </div>

                    <div class="morph-arrows" id="morphArrows">
                        <div class="arrow-particle"></div>
                        <div class="arrow-particle"></div>
                        <div class="arrow-particle"></div>
                        <svg class="arrow-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        <div class="arrow-particle"></div>
                        <div class="arrow-particle"></div>
                    </div>

                    <div class="block-container" id="bedrockBlock">
                        <div class="mc-block bedrock-block">
                            <div class="block-face block-front"><span>B</span></div>
                            <div class="block-face block-back"></div>
                            <div class="block-face block-right"></div>
                            <div class="block-face block-left"></div>
                            <div class="block-face block-top"></div>
                            <div class="block-face block-bottom"></div>
                        </div>
                        <span class="block-label">Bedrock</span>
                    </div>
                </div>
            </div>

            <!-- AI Status Log -->
            <div class="ai-log" id="aiLog">
                <div class="ai-log-header">
                    <div class="ai-pulse"></div>
                    <span id="aiLogTitle">AI is converting...</span>
                </div>
                <div class="ai-log-entries" id="aiLogEntries">
                    <!-- Dynamically populated -->
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>

        <!-- Results Section (hidden until complete) -->
        <section id="resultSection" class="hidden">
            <div class="result-card">
                <div class="result-header">
                    <div class="result-icon success-glow" id="resultIcon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <div>
                        <h2 id="resultTitle">Addon Ready!</h2>
                        <p id="resultSubtitle" class="text-muted"></p>
                    </div>
                </div>

                <!-- Similarity Score Ring -->
                <div class="similarity-ring-container">
                    <div class="similarity-ring" id="similarityRing">
                        <svg viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="52" class="ring-bg"/>
                            <circle cx="60" cy="60" r="52" class="ring-fill" id="ringFill"
                                stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
                        </svg>
                        <div class="ring-text">
                            <span class="ring-percent" id="ringPercent">0</span>
                            <span class="ring-label">% Similar</span>
                        </div>
                    </div>
                    <p class="similarity-verdict" id="similarityVerdict"></p>
                </div>

                <!-- Score Breakdown -->
                <div class="score-breakdown" id="scoreBreakdown">
                    <!-- Dynamically populated -->
                </div>

                <!-- AI Stats -->
                <div class="ai-stats" id="aiStats">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- Download Button -->
            <a id="downloadBtn" class="download-btn" download="converted.mcaddon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span id="downloadBtnText">Download .mcaddon</span>
            </a>

            <!-- Validation Warnings -->
            <div class="warnings-panel hidden" id="warningsPanel">
                <details class="warnings-details">
                    <summary class="warnings-summary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span id="warningsCount">Warnings</span>
                    </summary>
                    <ul class="warnings-list" id="warningsList"></ul>
                </details>
            </div>

            <!-- Convert Another -->
            <button class="btn-secondary" id="convertAnotherBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                Convert Another Mod
            </button>
        </section>

        <!-- Error Section -->
        <section id="errorSection" class="hidden">
            <div class="error-card">
                <div class="error-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h3 id="errorTitle">Conversion Failed</h3>
                <p id="errorMessage" class="text-muted"></p>
                <button class="btn-secondary" id="retryBtn">Try Again</button>
            </div>
        </section>
    </div>

    <script src="animation.js"></script>
    <script src="script.js"></script>
</body>
</html>
